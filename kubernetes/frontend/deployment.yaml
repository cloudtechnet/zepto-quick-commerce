apiVersion: apps/v1
kind: Deployment
metadata:
  name: zepto-frontend
  namespace: zepto

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zepto-frontend

  template:

    metadata:
      labels:
        app: zepto-frontend

    spec:

      containers:

        - name: frontend

          image: asia-south1-docker.pkg.dev/zepto-ecommerce-class/zepto-repo/zepto-frontend:v1

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zepto-backend
  namespace: zepto

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zepto-backend

  template:

    metadata:
      labels:
        app: zepto-backend

    spec:

      containers:

        - name: backend

          image: asia-south1-docker.pkg.dev/zepto-ecommerce-class-505916/zepto-repo/zepto-backend

          ports:
            - containerPort: 5000

          env:

            - name: PORT
              value: "5000"

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: DB_PORT

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: DB_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: DB_NAME

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zepto-db-secret
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
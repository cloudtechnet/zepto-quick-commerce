name: Zepto Quick Commerce CI/CD

on:
  push:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:

  # ==========================================
  # JOB 1: TEST APPLICATION
  # ==========================================

  test:

    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Frontend Test
      # ----------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ----------------------------------------
      # Backend Test
      # ----------------------------------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Check Backend Application
        working-directory: backend
        run: node --check server.js


  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  build-and-push:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Authenticate to Google Cloud
      # ----------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ----------------------------------------
      # Setup gcloud
      # ----------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # ----------------------------------------
      # Configure Docker
      # ----------------------------------------

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # ----------------------------------------
      # Docker Image Tag
      # ----------------------------------------

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ----------------------------------------
      # Build Frontend Image
      # ----------------------------------------

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }} \
            ./frontend

      # ----------------------------------------
      # Build Backend Image
      # ----------------------------------------

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }} \
            ./backend

      # ----------------------------------------
      # Push Frontend
      # ----------------------------------------

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      # ----------------------------------------
      # Push Backend
      # ----------------------------------------

      - name: Push Backend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}


  # ==========================================
  # JOB 3: DEPLOY TO GKE
  # ==========================================

  deploy:

    name: Deploy to GKE

    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Authenticate to Google Cloud
      # ----------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ----------------------------------------
      # Setup Google Cloud CLI
      # ----------------------------------------

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # ----------------------------------------
      # Get GKE Credentials
      # ----------------------------------------

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      # ----------------------------------------
      # Set Image Tag
      # ----------------------------------------

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ----------------------------------------
      # Ensure Manifests Applied (create if missing)
      # ----------------------------------------

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/ -n ${{ env.K8S_NAMESPACE }} -R

      # ----------------------------------------
      # Update Backend Image
      # ----------------------------------------

      - name: Update Backend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-backend \
            backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}

      # ----------------------------------------
      # Update Frontend Image
      # ----------------------------------------

      - name: Update Frontend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-frontend \
            frontend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      # ----------------------------------------
      # Wait for Backend Rollout
      # ----------------------------------------

      - name: Verify Backend Deployment
        run: |
          kubectl rollout status \
            deployment/zepto-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      # ----------------------------------------
      # Debug Rollout (auto-diagnose on failure)
      # ----------------------------------------

      - name: Debug Backend Pods
        if: always()
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=zepto-backend
          echo "---- DESCRIBE ----"
          kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=zepto-backend
          echo "---- LOGS ----"
          kubectl logs -n ${{ env.K8S_NAMESPACE }} -l app=zepto-backend --all-containers --tail=100 || true

      # ----------------------------------------
      # Wait for Frontend Rollout
      # ----------------------------------------

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status \
            deployment/zepto-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      # ----------------------------------------
      # Debug Rollout (auto-diagnose on failure)
      # ----------------------------------------

      - name: Debug Frontend Pods
        if: always()
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=zepto-frontend
          echo "---- DESCRIBE ----"
          kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=zepto-frontend
          echo "---- LOGS ----"
          kubectl logs -n ${{ env.K8S_NAMESPACE }} -l app=zepto-frontend --all-containers --tail=100 || true

      # ----------------------------------------
      # Debug Frontend Probe (curl + nginx config)
      # ----------------------------------------

      - name: Debug Frontend Probe
        if: always()
        run: |
          POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=zepto-frontend -o jsonpath='{.items[0].metadata.name}')
          echo "---- CURL / ----"
          kubectl exec -n ${{ env.K8S_NAMESPACE }} $POD -- curl -sv http://localhost:80/ || true
          echo "---- NGINX CONFIG ----"
          kubectl exec -n ${{ env.K8S_NAMESPACE }} $POD -- cat /etc/nginx/conf.d/default.conf || true

      # ----------------------------------------
      # Verify Pods
      # ----------------------------------------

      - name: Verify Kubernetes Resources
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
